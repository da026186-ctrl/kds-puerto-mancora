<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador KDS Puerto Máncora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* VOICE work tool for a kitchen in rush hour, clear at arm's length
   IDEA the KDS screen and paper tickets of a seafood kitchen in Máncora
   PICTURE the live ticket board with semáforo headers, the mozo's tablet beside it
   COLOUR white ground, ocean #0a5c7a band, sand panels, coral #ff5a3c for modifiers; green/amber/red only for time
   TYPE Barlow Condensed 700 for tickets and figures + Barlow for text
   LAYOUT sea band on top with sala and clock; below, the view; phone: one column, sticky send button */
:root{--cond:"Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif;color-scheme:light dark;--bg:light-dark(#ffffff,#06161f);--ink:light-dark(#0c1a22,#e6f0f4);--mute:light-dark(#4f6470,#9db3bf);--sea:light-dark(#0a5c7a,#0c4b63);--sea2:light-dark(#e3f1f6,#0b2733);--sand:light-dark(#f6ecda,#1b2a2f);--panel:light-dark(#f5f8fa,#0b202a);--line:light-dark(#d5dfe5,#1d3946);--coral:#ff5a3c;--ok:#1f9d55;--warn:#e3a008;--bad:#d93025;--paper:light-dark(#ffffff,#0f2733)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.cond{font-family:var(--cond);font-weight:700;letter-spacing:-.01em;line-height:1.05;margin:0}
h1{font-size:clamp(32px,5vw,48px)}
h2{font-size:28px}
h3{font-size:21px}
button,input,select{font:inherit;font-size:16px}
button{cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;min-height:44px;padding:8px 14px;font-weight:600}
button:hover{border-color:var(--sea)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
button.pri{background:var(--sea);border-color:var(--sea);color:#fff}
button.hot{background:var(--coral);border-color:var(--coral);color:#fff}
button.ghost{background:transparent}
input,select{min-height:44px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--paper);color:var(--ink);width:100%}
label{font-weight:600;font-size:14px;display:block;margin-bottom:4px}
.top{background:var(--sea);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px max(3vw,16px)}
.top .brand{font-family:var(--cond);font-weight:700;font-size:24px;line-height:1;margin-right:auto}
.top .brand small{display:block;font-family:Barlow,system-ui,sans-serif;font-weight:500;font-size:13px;opacity:.85}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;background:rgba(255,255,255,.14);font-weight:600;font-size:14px;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;background:#9aa;flex:none}
.dot.on{background:#3ddc84}.dot.wait{background:#ffd23f}.dot.off{background:#c9d3d8}
.clock{font-family:var(--cond);font-size:30px;line-height:1;white-space:nowrap}
.clock small{font-family:Barlow,system-ui,sans-serif;font-size:12px;display:block;opacity:.85}
main{padding:18px max(3vw,16px) 40px}
.muted{color:var(--mute)}
.small{font-size:14px}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stack>*+*{margin-top:12px}
.home-hero{background:var(--sand);border-radius:16px;padding:clamp(18px,3vw,32px);display:grid;gap:18px;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:center}
.home-hero p{max-width:60ch}
.mini-board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media(max-width:700px){.home-hero{grid-template-columns:1fr}}
/* tickets */
.board{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));align-items:start}
.ticket{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 1px 0 var(--line)}
.ticket .th{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:8px 12px;color:#fff;background:var(--ok)}
.ticket .th.warn{background:var(--warn);color:#1b1300}
.ticket .th.bad{background:var(--bad)}
.ticket .th.pase{background:var(--mute)}
.ticket .th b{font-family:var(--cond);font-size:24px;line-height:1}
.ticket .th span{font-family:var(--cond);font-size:22px;white-space:nowrap}
.ticket .tm{padding:4px 12px 0;font-size:13px;color:var(--mute)}
.it{padding:10px 12px;border-top:1px dashed var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center}
.it .nm{font-family:var(--cond);font-size:22px;line-height:1.05}
.it .mods{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px}
.mod{background:var(--coral);color:#fff;border-radius:6px;padding:1px 8px;font-weight:600;font-size:14px}
.tag{border-radius:6px;padding:1px 8px;font-weight:700;font-size:13px;background:var(--bad);color:#fff}
.it.done{opacity:.55}
.it button{min-width:96px}
.t-ok{color:var(--ok)}.t-warn{color:#b07800}.t-bad{color:var(--bad)}
.counters{display:flex;flex-wrap:wrap;gap:8px}
.counter{background:var(--sea2);border-radius:10px;padding:6px 12px;font-weight:600;white-space:nowrap}
.counter b{font-family:var(--cond);font-size:22px;margin-right:4px}
/* mozo */
.tabs{display:flex;gap:6px;margin:12px 0}
.tabs button{flex:1}
.tabs button[aria-selected=true]{background:var(--sea);color:#fff;border-color:var(--sea)}
.mesas{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.mesas button{padding:6px 0;font-family:var(--cond);font-size:20px}
.mesas button[aria-pressed=true]{background:var(--sea);color:#fff;border-color:var(--sea)}
.carta{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr))}
.carta button{text-align:left;display:flex;justify-content:space-between;gap:6px;align-items:center;font-weight:600}
.carta button small{font-weight:500;color:var(--mute);white-space:nowrap}
.cart-line{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--paper)}
.cart-line .row{justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chips button{min-height:36px;padding:3px 10px;font-size:14px;font-weight:600;border-radius:999px}
.chips button[aria-pressed=true]{background:var(--coral);border-color:var(--coral);color:#fff}
.ficha{background:var(--sand);border-radius:12px;padding:12px 14px;border:1px solid var(--line)}
.ficha q{display:block;font-size:17px;margin-top:4px}
.sticky-send{position:sticky;bottom:0;background:var(--bg);padding:10px 0 4px;margin-top:10px}
.sticky-send button{width:100%;font-size:18px}
.order{border:1px solid var(--line);border-radius:12px;background:var(--paper);overflow:hidden}
.order .oh{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;background:var(--sea2);font-weight:600}
.oi{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between;padding:8px 12px;border-top:1px solid var(--line)}
.st{font-size:13px;font-weight:700;border-radius:6px;padding:2px 8px;background:var(--sea2);white-space:nowrap}
.st.ready{background:var(--ok);color:#fff}.st.deliv{background:transparent;border:1px solid var(--line)}.st.ret{background:var(--bad);color:#fff}
/* panel */
.sala{font-family:var(--cond);font-size:clamp(44px,7vw,72px);line-height:.95;letter-spacing:.02em}
.qrs{display:grid;gap:12px;grid-template-columns:repeat(3,minmax(0,1fr))}
.qr{background:#fff;color:#0c1a22;border-radius:12px;padding:10px;text-align:center;border:1px solid var(--line)}
.qr svg{width:100%;height:auto;max-width:190px;display:block;margin:0 auto}
.qr b{font-family:var(--cond);font-size:20px;display:block}
@media(max-width:560px){.qrs{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.qr b{font-size:16px}}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .v{font-family:var(--cond);font-size:44px;line-height:1}
.kpi .meter{height:8px;border-radius:4px;background:var(--line);margin-top:8px;overflow:hidden}
.kpi .meter i{display:block;height:100%;background:var(--ok)}
.kpi.warn .meter i{background:var(--warn)}.kpi.bad .meter i{background:var(--bad)}
.kpi.warn .v{color:#b07800}.kpi.bad .v{color:var(--bad)}.kpi.ok .v{color:var(--ok)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:13px;color:var(--mute);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ap{color:var(--ok);font-weight:700}.na{color:var(--bad);font-weight:700}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;max-width:min(92vw,520px);z-index:9;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.demo{display:grid;gap:14px;grid-template-columns:minmax(300px,380px) minmax(0,1fr) minmax(0,1fr);align-items:start}
.demo>section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
@media(max-width:1100px){.demo{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.demo>section:first-child{grid-column:1/-1}}
@media(max-width:700px){.demo{grid-template-columns:1fr}}
.empty{padding:20px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:12px}
.note{background:var(--sea2);border-radius:10px;padding:10px 12px;font-size:15px}
@media(prefers-reduced-motion:no-preference){.ticket.new{animation:drop .5s ease-out}@keyframes drop{from{transform:translateY(-10px);opacity:.2}to{transform:none;opacity:1}}}
@media(max-width:600px){table{font-size:13px}th,td{padding:6px 4px}.mesas{grid-template-columns:repeat(4,minmax(0,1fr))}.top{gap:6px 10px}.top .brand small,.clock small{display:none}.clock{font-size:24px}}
</style>
</head>
<body>
<div class="top" id="top">
  <div class="brand">Puerto Máncora · KDS<small>Simulador de comandas para simulacros</small></div>
  <span class="chip" id="salaChip" hidden></span>
  <span class="chip"><span class="dot" id="netDot"></span><span id="netTxt">Solo esta pantalla</span></span>
  <div class="clock" id="clock" hidden><small>Reloj de hora punta</small><span id="clockTxt">13:00</span></div>
</div>
<main id="app"></main>
<div class="toast" id="toast" hidden></div>

<script>
{
/* ---------- datos del restaurante (carta referencial para el simulacro) ---------- */
const CARTA=[
 {id:'cevcla',n:'Ceviche clásico',st:'fria',p:38,std:8},
 {id:'cevmix',n:'Ceviche mixto',st:'fria',p:45,std:9},
 {id:'conchas',n:'Ceviche de conchas negras',st:'fria',p:48,std:9},
 {id:'tirad',n:'Tiradito de pescado',st:'fria',p:36,std:8},
 {id:'causa',n:'Causa de langostinos',st:'fria',p:32,std:7},
 {id:'leche',n:'Leche de tigre',st:'fria',p:22,std:5},
 {id:'chich',n:'Chicharrón de pescado',st:'caliente',p:38,std:12},
 {id:'jalea',n:'Jalea mixta',st:'caliente',p:48,std:14},
 {id:'arroz',n:'Arroz con mariscos',st:'caliente',p:42,std:15},
 {id:'sudado',n:'Sudado de mero',st:'caliente',p:52,std:16},
 {id:'pari',n:'Parihuela',st:'caliente',p:50,std:18},
 {id:'majar',n:'Majarisco',st:'caliente',p:48,std:15},
 {id:'seco',n:'Seco de cabrito norteño',st:'caliente',p:45,std:12}];
const DISH=Object.fromEntries(CARTA.map(d=>[d.id,d]));
const MODS=['Sin ají','Ají aparte','Poco picante','Sin cebolla','Con yuca','Con camote','Con chifles','Sin culantro'];
const REASONS=['Plato equivocado','No respetó el modificador','Llegó frío','Demora'];
const ST_NAME={fria:'Estación fría',caliente:'Estación caliente'};
const MARGIN=5, MESA_MAX=25, NMESAS=12;
const META={P1:100,C1:95,P2:98,A1:100};
const BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081/mqtt'];
const TYPES=['session','meta','close','join','ficha','order','pos_only','start','ready','deliver','return','cancel'];

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=n=>Math.random().toString(36).slice(2,2+n);
const uid=p=>p+rnd(6)+Date.now().toString(36).slice(-3);
const pad=n=>String(n).padStart(2,'0');
const pick=a=>a[Math.floor(Math.random()*a.length)];
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const EMBED=(()=>{try{return window.self!==window.top}catch(e){return true}})();
const WEB=/^https?:$/.test(location.protocol);
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,3800)}
function clean(s,n){return String(s==null?'':s).replace(/[\u0000-\u001f]/g,' ').trim().slice(0,n)}

/* ---------- ruta ---------- */
const P=(()=>{const q=new URLSearchParams(location.search);let sala=q.get('sala'),vista=q.get('vista'),b=q.get('b');
 const h=location.hash.replace(/^#/,'');const m=h.match(/^sala-([a-z0-9]+)(?:-([a-z]+))?$/i);
 if(m){sala=sala||m[1];vista=vista||m[2]}else if(h&&!vista)vista=h;
 return{sala:sala?sala.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8):null,vista:vista||'inicio',b:b!=null&&/^\d$/.test(b)?+b:null,broker:q.get('broker')}})();
let ROUTE={vista:['inicio','panel','mozo','fria','caliente','demo'].includes(P.vista)?P.vista:'inicio',sala:P.sala};
function baseUrl(){return location.origin+location.pathname}
function linkFor(vista){const b=Sync.bIdx!=null?'&b='+Sync.bIdx:'';const br=P.broker?'&broker='+encodeURIComponent(P.broker):'';return baseUrl()+'?sala='+ROUTE.sala+'&vista='+vista+b+br}
function go(vista,sala){ROUTE={vista,sala:sala||ROUTE.sala};
 if(!EMBED&&WEB){try{history.replaceState(null,'',ROUTE.sala?linkFor(vista):baseUrl())}catch(e){}}
 if(ROUTE.sala&&Sync.room!==ROUTE.sala)openRoom(ROUTE.sala);mount()}

/* ---------- sincronización (local + MQTT) ---------- */
const Sync={room:null,evs:new Map(),bc:null,cli:null,bIdx:P.b,status:'local',seen:{},logT:0,saveT:0};
function valid(e){if(!e||typeof e!=='object')return false;if(typeof e.id!=='string'||e.id.length>40||typeof e.t!=='number'||!TYPES.includes(e.type))return false;
 if(!e.by||typeof e.by.pid!=='string')return false;e.by={pid:clean(e.by.pid,40),name:clean(e.by.name,40)||'Sin nombre',role:clean(e.by.role,12)};return true}
function persist(){clearTimeout(Sync.saveT);Sync.saveT=setTimeout(()=>LS.set('pmkds:'+Sync.room,[...Sync.evs.values()]),250)}
function openRoom(room){Sync.room=room;Sync.evs=new Map();for(const e of LS.get('pmkds:'+room,[]))if(valid(e))Sync.evs.set(e.id,e);
 try{Sync.bc&&Sync.bc.close()}catch(e){}try{Sync.bc=new BroadcastChannel('pmkds-'+room);Sync.bc.onmessage=m=>ingest(m.data,'bc')}catch(e){Sync.bc=null}
 try{Sync.cli&&Sync.cli.end(true)}catch(e){}Sync.cli=null;recompute();connect()}
function addEvent(type,payload,by){const e=Object.assign({id:uid('e'),t:Date.now(),type,by},payload);Sync.evs.set(e.id,e);persist();recompute();
 try{Sync.bc&&Sync.bc.postMessage({kind:'ev',ev:e})}catch(_){}pub('ev',JSON.stringify(e),false);schedLog(900);return e}
function ingest(m,src){if(!m)return;if(m.kind==='hb'){hb(m.hb);return}
 const arr=m.kind==='ev'?[m.ev]:m.kind==='log'&&Array.isArray(m.evs)?m.evs.slice(0,4000):[];let ch=false;
 for(const e of arr){if(valid(e)&&!Sync.evs.has(e.id)){Sync.evs.set(e.id,e);ch=true}}
 if(ch){persist();recompute()}
 if(m.kind==='log'&&src==='mqtt'&&arr.length<Sync.evs.size)schedLog(600+Math.random()*900)}
function pub(t,s,retain){try{if(Sync.cli&&Sync.cli.connected)Sync.cli.publish('pmkds/v1/'+Sync.room+'/'+t,s,{qos:1,retain:!!retain})}catch(e){}}
function schedLog(ms){clearTimeout(Sync.logT);Sync.logT=setTimeout(()=>pub('log',JSON.stringify([...Sync.evs.values()]),true),ms)}
function setNet(s){Sync.status=s;const d=$('#netDot'),t=$('#netTxt');d.className='dot '+(s==='online'?'on':s==='wait'?'wait':'off');
 t.textContent=s==='online'?'En línea · '+devCount()+' dispositivo(s)':s==='wait'?'Conectando…':EMBED?'Vista previa: solo esta pantalla':'Solo esta pantalla'}
function devCount(){const now=Date.now();return Object.values(Sync.seen).filter(x=>now-x.at<25000).map(x=>x.dev).filter((v,i,a)=>a.indexOf(v)===i).length||1}
function loadMqtt(){return new Promise(res=>{if(window.mqtt)return res(true);const srcs=['mqtt.min.js','https://cdn.jsdelivr.net/npm/mqtt@5.15.1/dist/mqtt.min.js','https://unpkg.com/mqtt@5.15.1/dist/mqtt.min.js'];let i=0;
 const next=()=>{if(window.mqtt)return res(true);if(i>=srcs.length)return res(false);const s=document.createElement('script');s.src=srcs[i++];s.onload=()=>window.mqtt?res(true):next();s.onerror=next;document.head.appendChild(s)};next()})}
async function connect(){if(EMBED||!WEB&&!P.broker){setNet('local');return}const room=Sync.room;setNet('wait');
 if(!await loadMqtt()){setNet('local');return}
 const list=P.broker?[P.broker]:Sync.bIdx!=null?[BROKERS[Sync.bIdx]]:BROKERS;
 for(let k=0;k<list.length;k++){if(Sync.room!==room)return;const ok=await tryBroker(list[k]);if(ok){if(!P.broker&&Sync.bIdx==null)Sync.bIdx=k;if(!EMBED&&WEB&&ROUTE.sala){try{history.replaceState(null,'',linkFor(ROUTE.vista))}catch(e){}}mountLive();return}}
 setNet('local')}
function tryBroker(url){return new Promise(res=>{let done=false,c;try{c=mqtt.connect(url,{clientId:'pmkds_'+rnd(8),clean:true,connectTimeout:6000,reconnectPeriod:3000,keepalive:30})}catch(e){return res(false)}
 const fail=()=>{if(done)return;done=true;try{c.end(true)}catch(_){}res(false)};const tm=setTimeout(fail,8000);
 c.on('connect',()=>{if(done){setNet('online');pubHello();schedLog(700);return}done=true;clearTimeout(tm);setup(c);res(true)})})}
function setup(c){Sync.cli=c;const base='pmkds/v1/'+Sync.room+'/';
 c.subscribe([base+'ev',base+'log',base+'hello',base+'hb'],{qos:1});
 c.on('message',(topic,buf)=>{let m;try{m=JSON.parse(buf.toString())}catch(e){return}const t=topic.slice(base.length);
  if(t==='ev')ingest({kind:'ev',ev:m},'mqtt');else if(t==='log')ingest({kind:'log',evs:m},'mqtt');else if(t==='hello'){if(m&&m.dev!==DEV)schedLog(300+Math.random()*900)}else if(t==='hb')hb(m)});
 c.on('close',()=>{if(Sync.cli===c)setNet('wait')});
 setNet('online');pubHello();schedLog(800);sendHB()}
function pubHello(){pub('hello',JSON.stringify({dev:DEV,t:Date.now()}),false)}
const DEV=LS.get('pmkds:dev',null)||(()=>{const d=uid('d');LS.set('pmkds:dev',d);return d})();
function hb(h){if(!h||typeof h.pid!=='string')return;Sync.seen[h.pid]={at:Date.now(),dev:clean(h.dev,30),name:clean(h.name,40),role:clean(h.role,12)};if(Sync.status==='online')setNet('online')}
function sendHB(){for(const id of activeIds()){const h={pid:id.pid,name:id.name,role:id.role,dev:DEV,t:Date.now()};pub('hb',JSON.stringify(h),false);try{Sync.bc&&Sync.bc.postMessage({kind:'hb',hb:h})}catch(e){}hb(h)}}
setInterval(sendHB,8000);

/* ---------- identidad por rol en este dispositivo ---------- */
function idKey(role){return 'pmkds:id:'+Sync.room+':'+role}
function getId(role){return LS.get(idKey(role),null)||MEM[role]||null}
const MEM={};

/* ---------- estado derivado ---------- */
let S=null;
function derive(evs){const s={session:null,closed:null,email:'',people:{},orders:{},items:{},pos:[],fichas:{}};
 const list=[...evs].sort((a,b)=>a.t-b.t||(a.id<b.id?-1:1));
 for(const e of list){const it=e.iid?s.items[e.iid]:null;switch(e.type){
  case 'session':if(!s.session&&[1,5,10,20].includes(e.speed))s.session={startedAt:e.t,speed:e.speed,simStart:+e.simStart||e.t,fac:e.by.name};break;
  case 'meta':s.email=clean(e.email,80);break;
  case 'close':if(s.session&&!s.closed)s.closed=e.t;break;
  case 'join':s.people[e.by.pid]={pid:e.by.pid,name:e.by.name,role:e.by.role,t:e.t};break;
  case 'ficha':if(Array.isArray(e.items))s.fichas[clean(e.fid,30)]={fid:clean(e.fid,30),mesa:+e.mesa||1,pax:+e.pax||1,items:e.items.filter(x=>DISH[x.dish]).slice(0,8).map(x=>({dish:x.dish,mods:(x.mods||[]).filter(m=>MODS.includes(m))})),by:e.by.pid};break;
  case 'order':{if(!s.session||s.closed||!Array.isArray(e.items))break;const oid=clean(e.oid,30);if(s.orders[oid])break;
   const o={oid,mesa:Math.max(1,Math.min(NMESAS,+e.mesa||1)),pax:Math.max(1,Math.min(12,+e.pax||1)),t:e.t,by:e.by,fid:e.fid?clean(e.fid,30):null,items:[],n:Object.keys(s.orders).length+1};s.orders[oid]=o;
   for(const x of e.items.slice(0,12)){if(!DISH[x.dish])continue;const iid=clean(x.iid,30);s.items[iid]={iid,oid,dish:x.dish,st:DISH[x.dish].st,mods:(x.mods||[]).filter(m=>MODS.includes(m)),t:e.t,start:null,ready:null,deliv:null,ret:null,reason:'',redoOf:null,cancel:null,cook:null,mozo:e.by};o.items.push(iid)}break}
  case 'pos_only':if(s.session&&DISH[e.dish])s.pos.push({iid:clean(e.iid,30),oid:clean(e.oid,30),mesa:+e.mesa||1,dish:e.dish,t:e.t,by:e.by});break;
  case 'start':if(it&&!it.start&&!it.cancel){it.start=e.t;it.cook=e.by}break;
  case 'ready':if(it&&!it.ready&&!it.cancel){it.ready=e.t;if(!it.start)it.start=e.t;if(!it.cook)it.cook=e.by}break;
  case 'deliver':if(it&&it.ready&&!it.deliv)it.deliv=e.t;break;
  case 'return':if(it&&it.deliv&&!it.ret){it.ret=e.t;it.reason=REASONS.includes(e.reason)?e.reason:'Plato equivocado';const nid=clean(e.newIid,30);
   s.items[nid]={iid:nid,oid:it.oid,dish:it.dish,st:it.st,mods:it.mods,t:e.t,start:null,ready:null,deliv:null,ret:null,reason:'',redoOf:it.iid,cancel:null,cook:null,mozo:it.mozo};s.orders[it.oid]&&s.orders[it.oid].items.push(nid)}break;
  case 'cancel':if(it&&!it.start)it.cancel=e.t;break}}
 return s}
function recompute(){S=derive(Sync.evs.values());mountLive()}
const simAt=t=>S&&S.session?S.session.simStart+(t-S.session.startedAt)*S.session.speed:t;
const simMin=(a,b)=>S&&S.session?(b-a)*S.session.speed/60000:0;
const clk=(t,sec)=>{const d=new Date(simAt(t));return pad(d.getHours())+':'+pad(d.getMinutes())+(sec?':'+pad(d.getSeconds()):'')};
const mmss=m=>{const s=Math.max(0,Math.floor(m*60));return pad(Math.floor(s/60))+':'+pad(s%60)};
function now(){return S&&S.closed?S.closed:Date.now()}
function light(it,ref){const m=simMin(it.t,ref||now()),std=DISH[it.dish].std;return m<=std?'ok':m<=std+MARGIN?'warn':'bad'}
function orderDone(o){const its=o.items.map(i=>S.items[i]).filter(i=>!i.cancel&&!i.ret);return its.length>0&&its.every(i=>i.deliv)}
function orderEnd(o){return Math.max(...o.items.map(i=>S.items[i]).filter(i=>!i.cancel&&i.deliv).map(i=>i.deliv))}

/* ---------- indicadores (mismas fórmulas que la tabla 62 del informe) ---------- */
function kpis(){const all=Object.values(S.items);const orig=all.filter(i=>!i.redoOf&&!i.cancel);
 const posN=orig.length+S.pos.length,kdsN=orig.length;
 const done=Object.values(S.orders).filter(orderDone);const fast=done.filter(o=>simMin(o.t,orderEnd(o))<=MESA_MAX);
 const deliv=all.filter(i=>i.deliv).length,ret=all.filter(i=>i.ret).length;
 const ev=evaluate().filter(r=>r.res!=='NO EVALUADO');const ok=ev.filter(r=>r.res==='APROBADO');
 const pct=(a,b)=>b?100*a/b:null;
 return{P1:{v:pct(kdsN,posN),d:kdsN+' de '+posN+' ítems vendidos pasaron por el KDS'},
  C1:{v:pct(fast.length,done.length),d:fast.length+' de '+done.length+' mesas en 25 min o menos'},
  P2:{v:deliv?100*(1-ret/deliv):null,d:ret+(ret===1?' devuelto':' devueltos')+' de '+deliv+' entregados'},
  A1:{v:pct(ok.length,ev.length),d:ok.length+' de '+ev.length+' participantes aprobados'}}}
function evaluate(){const out=[];for(const p of Object.values(S.people)){if(p.role==='panel')continue;
 if(p.role==='mozo'){let exp=0,hit=0,den=0,g=0,del=0;for(const o of Object.values(S.orders)){if(o.by.pid!==p.pid)continue;
   const its=o.items.map(i=>S.items[i]).filter(i=>!i.redoOf);del+=its.filter(i=>i.deliv).length;if(!o.fid||!S.fichas[o.fid])continue;g++;
   const want=S.fichas[o.fid].items.map(x=>x.dish+'|'+[...x.mods].sort().join('+'));const sent=its.filter(i=>!i.cancel).map(i=>i.dish+'|'+[...i.mods].sort().join('+'));
   const pool=[...sent];let m=0;for(const w of want){const k=pool.indexOf(w);if(k>=0){m++;pool.splice(k,1)}}exp+=want.length;hit+=m;den+=Math.max(want.length,sent.length)}
  const acc=den?100*hit/den:null;const res=!g?'NO EVALUADO':acc>=90&&del>0?'APROBADO':'NO APROBADO';
  out.push({p,rol:'Mozo',g,exp,hit,acc,att:null,ont:null,otp:null,res,crit:!g?'Sin pedidos con ficha guiada':'Exactitud ≥ 90 % y al menos un plato entregado'})}
 else{const its=Object.values(S.items).filter(i=>i.cook&&i.cook.pid===p.pid&&i.ready);const ont=its.filter(i=>light(i,i.ready)!=='bad').length;
  const otp=its.length?100*ont/its.length:null;const res=its.length<2?'NO EVALUADO':otp>=80?'APROBADO':'NO APROBADO';
  out.push({p,rol:'Cocinero '+(p.role==='fria'?'fría':'caliente'),g:null,exp:null,hit:null,acc:null,att:its.length,ont,otp,res,crit:its.length<2?'Menos de 2 platos atendidos':'80 % de platos listos antes del rojo'})}}
 return out}

function csv(rows){return '﻿'+rows.map(r=>r.map(v=>{v=v==null?'':String(v);return /[,"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\r\n')+'\r\n'}
function dt(t){if(!t)return '';const d=new Date(simAt(t));return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())}
function files(){const d=new Date(S.session.simStart),f=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());const n=new Date(),stamp=f.replace(/-/g,'')+'-'+pad(n.getHours())+pad(n.getMinutes())+pad(n.getSeconds());
 const os=Object.values(S.orders).sort((a,b)=>a.t-b.t);const pos=[['sesion','fecha','pedido','mesa','item_id','plato','estacion','precio','canal','mozo','hora_venta']];
 for(const o of os)for(const iid of o.items){const i=S.items[iid];if(i.redoOf||i.cancel)continue;pos.push([ROUTE.sala,f,o.n,o.mesa,i.iid,DISH[i.dish].n,i.st,DISH[i.dish].p.toFixed(2),'COMANDA MOVIL',o.by.name,dt(o.t)])}
 for(const p of S.pos)pos.push([ROUTE.sala,f,'CAJA',p.mesa,p.iid,DISH[p.dish].n,DISH[p.dish].st,DISH[p.dish].p.toFixed(2),'CAJA (TALONARIO)',p.by.name,dt(p.t)]);
 const kds=[['sesion','fecha','pedido','mesa','item_id','plato','estacion','modificadores','estandar_min','hora_ingreso','hora_inicio','hora_listo','hora_despacho','devuelto','motivo_devolucion','rehace_item','cocinero','mozo','estado']];
 for(const o of os)for(const iid of o.items){const i=S.items[iid];kds.push([ROUTE.sala,f,o.n,o.mesa,i.iid,DISH[i.dish].n,i.st,i.mods.join(' + '),DISH[i.dish].std,dt(i.t),dt(i.start),dt(i.ready),dt(i.deliv),i.ret?'SI':'NO',i.reason,i.redoOf||'',i.cook?i.cook.name:'',o.by.name,i.cancel?'ANULADO':i.ret?'DEVUELTO':i.deliv?'ENTREGADO':i.ready?'LISTO':i.start?'EN PREPARACION':'EN COLA'])}
 const sim=[['sesion','fecha','participante','rol','pedidos_guiados','items_esperados','items_correctos','exactitud_pct','items_atendidos','items_a_tiempo','a_tiempo_pct','resultado','criterio','facilitador','correo_reporte','velocidad']];
 const ev=evaluate();for(const r of ev)sim.push([ROUTE.sala,f,r.p.name,r.rol,r.g,r.exp,r.hit,r.acc==null?'':r.acc.toFixed(1),r.att,r.ont,r.otp==null?'':r.otp.toFixed(1),r.res,r.crit,S.session.fac,S.email,S.session.speed]);
 if(!ev.length)sim.push([ROUTE.sala,f,'(sin participantes)','','','','','','','','','NO EVALUADO','',S.session.fac,S.email,S.session.speed]);
 return[{name:'PM_POS_'+ROUTE.sala+'_'+stamp+'.csv',text:csv(pos)},{name:'PM_KDS_'+ROUTE.sala+'_'+stamp+'.csv',text:csv(kds)},{name:'PM_SIMULACRO_'+ROUTE.sala+'_'+stamp+'.csv',text:csv(sim)}]}
async function save(f){try{if(window.claude&&window.claude.use){const d=await window.claude.use('downloads');if(d){await d.save({filename:f.name,data:f.text});toast('Guardado: '+f.name);return}}}catch(e){if(e&&e.code==='declined')return}
 try{const u=URL.createObjectURL(new Blob([f.text],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Descargado: '+f.name)}catch(e){toast('No se pudo descargar '+f.name)}}

/* ---------- mozo (tablet comandera) ---------- */
function newFicha(id){const m=UI.mozo;const busy=new Set(Object.values(S.orders).filter(o=>!orderDone(o)).map(o=>o.mesa));let mesa=1+Math.floor(Math.random()*NMESAS),k=0;while(busy.has(mesa)&&k++<20)mesa=1+Math.floor(Math.random()*NMESAS);
 const n=1+Math.floor(Math.random()*3),items=[];for(let i=0;i<n;i++){const d=pick(CARTA);const mods=Math.random()<.6?[pick(MODS)]:[];items.push({dish:d.id,mods})}
 const fid=uid('f');addEvent('ficha',{fid,mesa,pax:Math.max(n,1+Math.floor(Math.random()*3)),items},id);m.fid=fid;m.mesa=mesa;m.pax=Math.max(n,2)}
function fichaText(f){return f.items.map(x=>'1 '+DISH[x.dish].n.toLowerCase()+(x.mods.length?' ('+x.mods.join(', ').toLowerCase()+')':'')).join(', ')}
function paneMozo(root){let built=false;
 return function(){const id=getId('mozo');if(!id){built=false;return joinForm(root,'mozo','Mozo · tablet comandera',()=>{built=false;mountLive()})}
  if(!built){built=true;root.innerHTML=`<div class="row" style="justify-content:space-between"><h2>Mozo · ${esc(id.name)}</h2><span class="small muted">Tablet comandera</span></div>
   <div class="tabs" role="tablist"><button role="tab" id="mtN">Nuevo pedido</button><button role="tab" id="mtM">Mis mesas</button></div><div id="mBody"></div>`;
   root.querySelector('#mtN').onclick=()=>{UI.mozo.tab='new';draw(true)};root.querySelector('#mtM').onclick=()=>{UI.mozo.tab='mine';draw(true)}}
  draw(false)};
 function draw(force){const m=UI.mozo,id=getId('mozo'),body=root.querySelector('#mBody');if(!body)return;
  root.querySelector('#mtN').setAttribute('aria-selected',m.tab==='new');root.querySelector('#mtM').setAttribute('aria-selected',m.tab==='mine');
  const readyN=Object.values(S.items).filter(i=>i.mozo.pid===id.pid&&i.ready&&!i.deliv&&!i.cancel).length;root.querySelector('#mtM').textContent='Mis mesas'+(readyN?' · '+readyN+' listo(s)':'');
  if(m.tab==='mine')return mine(body,id);
  if(!force&&body.dataset.v==='new'&&body.dataset.s===(S.session?1:0)+''+(S.closed?1:0))return;body.dataset.v='new';body.dataset.s=(S.session?1:0)+''+(S.closed?1:0);
  if(!S.session){body.innerHTML='<div class="empty">Esperando que el facilitador inicie el simulacro.<br><br><button class="pri" data-selfstart>Iniciar una prueba ahora</button><br><span class="small muted">Úsalo si estás probando solo: arranca el simulacro en esta sala.</span></div>';return}
  if(S.closed){body.innerHTML='<div class="empty">El simulacro terminó. Gracias por participar.</div>';return}
  if(m.guided&&(!m.fid||!S.fichas[m.fid]))newFicha(id);
  const f=m.guided?S.fichas[m.fid]:null;
  body.innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:8px"><label style="display:flex;gap:8px;align-items:center;margin:0"><input type="checkbox" id="mG" style="width:22px;min-height:22px" ${m.guided?'checked':''}> Ficha guiada (evalúa la exactitud)</label>${f?'<button class="ghost" id="mNF">Otra ficha</button>':''}</div>
  ${f?`<div class="ficha"><b>Mesa ${f.mesa} · ${f.pax} comensales</b><q>${esc(fichaText(f))}</q><div class="small muted">Registra exactamente lo que pide la mesa, con sus modificadores.</div></div>`:''}
  <div class="stack" style="margin-top:12px"><div><label>Mesa</label><div class="mesas">${Array.from({length:NMESAS},(_,i)=>`<button data-mesa="${i+1}" aria-pressed="${m.mesa===i+1}">${i+1}</button>`).join('')}</div></div>
  <div class="row"><label style="margin:0">Comensales</label><button data-pax="-1" aria-label="Menos">−</button><b class="cond" style="font-size:24px">${m.pax}</b><button data-pax="1" aria-label="Más">+</button></div>
  <div><div class="tabs" style="margin:0 0 8px"><button data-stn="fria" aria-selected="${m.stn==='fria'}">Carta fría</button><button data-stn="caliente" aria-selected="${m.stn==='caliente'}">Carta caliente</button></div>
  <div class="carta">${CARTA.filter(d=>d.st===m.stn).map(d=>`<button data-add="${d.id}"><span>${esc(d.n)}</span><small>S/ ${d.p}</small></button>`).join('')}</div></div>
  <div><label>Pedido de la mesa ${m.mesa}</label>${m.cart.length?m.cart.map((c,k)=>`<div class="cart-line" style="margin-bottom:6px"><div class="row"><b>${esc(DISH[c.dish].n)}</b><button class="ghost" data-del="${k}" aria-label="Quitar">Quitar</button></div><div class="chips">${MODS.map(x=>`<button data-mod="${k}|${x}" aria-pressed="${c.mods.includes(x)}">${x}</button>`).join('')}</div></div>`).join(''):'<div class="empty">Toca los platos de la carta para agregarlos.</div>'}</div></div>
  <div class="sticky-send"><button class="pri" id="mSend" ${m.cart.length?'':'disabled'}>Enviar a cocina (${m.cart.length} plato${m.cart.length===1?'':'s'})</button></div>`;
  body.querySelector('#mG').onchange=e=>{m.guided=e.target.checked;draw(true)};const nf=body.querySelector('#mNF');if(nf)nf.onclick=()=>{m.fid=null;m.cart=[];draw(true)};
  body.querySelectorAll('[data-mesa]').forEach(b=>b.onclick=()=>{m.mesa=+b.dataset.mesa;draw(true)});
  body.querySelectorAll('[data-pax]').forEach(b=>b.onclick=()=>{m.pax=Math.max(1,Math.min(12,m.pax+ +b.dataset.pax));draw(true)});
  body.querySelectorAll('[data-stn]').forEach(b=>b.onclick=()=>{m.stn=b.dataset.stn;draw(true)});
  body.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{if(m.cart.length>=10)return;m.cart.push({dish:b.dataset.add,mods:[]});draw(true)});
  body.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{m.cart.splice(+b.dataset.del,1);draw(true)});
  body.querySelectorAll('[data-mod]').forEach(b=>b.onclick=()=>{const[k,x]=b.dataset.mod.split('|');const c=m.cart[+k];const j=c.mods.indexOf(x);j>=0?c.mods.splice(j,1):c.mods.push(x);b.setAttribute('aria-pressed',j<0)});
  body.querySelector('#mSend').onclick=()=>{if(!m.cart.length||!S.session||S.closed)return;const e=addEvent('order',{oid:uid('o'),mesa:m.mesa,pax:m.pax,fid:m.guided?m.fid:null,items:m.cart.map(c=>({iid:uid('i'),dish:c.dish,mods:c.mods.slice()}))},id);
   const o=S.orders[e.oid];toast('Pedido '+(o?o.n:'')+' enviado: llegó a cocina por estación.');m.cart=[];m.fid=null;draw(true)}}
 function mine(body,id){const os=Object.values(S.orders).filter(o=>o.by.pid===id.pid).sort((a,b)=>b.t-a.t);const m=UI.mozo;
  const sig='mine|'+(S.closed?1:0)+'|'+m.retIid+'|'+os.map(o=>o.oid+':'+o.items.map(i=>{const x=S.items[i];return (x.start?'s':'')+(x.ready?'r':'')+(x.deliv?'d':'')+(x.ret?'x':'')+(x.cancel?'c':'')}).join('.')).join(',');
  if(body.dataset.v==='mine'&&body.dataset.sig===sig)return;body.dataset.v='mine';body.dataset.sig=sig;
  if(!os.length){body.innerHTML='<div class="empty">Todavía no enviaste pedidos.</div>';return}
  body.innerHTML='<div class="stack">'+os.map(o=>{const dn=orderDone(o);const mins=simMin(o.t,dn?orderEnd(o):now());
   return `<div class="order"><div class="oh"><span>Mesa ${o.mesa} · Pedido ${o.n}</span><span class="${mins<=MESA_MAX?'t-ok':'t-bad'}" data-ot="${o.oid}">${dn?'Atendida en '+mins.toFixed(0)+' min':mmss(mins)}</span></div>`+
   o.items.map(iid=>{const i=S.items[iid];const st=i.cancel?'<span class="st deliv">Anulado</span>':i.ret?'<span class="st ret">Devuelto: '+esc(i.reason)+'</span>':i.deliv?'<span class="st deliv">Entregado</span>':i.ready?'<span class="st ready">Listo en el pase</span>':i.start?'<span class="st">En preparación</span>':'<span class="st">En cola</span>';
    let act='';if(!S.closed){if(i.ready&&!i.deliv)act=`<button class="pri" data-dv="${iid}">Entregar</button>`;else if(i.deliv&&!i.ret)act=m.retIid===iid?REASONS.map(r=>`<button data-rr="${iid}|${r}">${r}</button>`).join(''):`<button class="ghost" data-rt="${iid}">Devolver</button>`;else if(!i.start&&!i.cancel)act=`<button class="ghost" data-cn="${iid}">Anular</button>`}
    return `<div class="oi"><div><b>${esc(DISH[i.dish].n)}</b>${i.redoOf?' <span class="tag">Rehecho</span>':''}${i.mods.length?'<div class="small" style="color:var(--coral);font-weight:600">'+esc(i.mods.join(' · '))+'</div>':''}</div><div class="row">${st}${act}</div></div>`}).join('')+'</div>'}).join('')+'</div>';
  body.querySelectorAll('[data-dv]').forEach(b=>b.onclick=()=>addEvent('deliver',{iid:b.dataset.dv},id));
  body.querySelectorAll('[data-cn]').forEach(b=>b.onclick=()=>addEvent('cancel',{iid:b.dataset.cn},id));
  body.querySelectorAll('[data-rt]').forEach(b=>b.onclick=()=>{m.retIid=b.dataset.rt;mine(body,id)});
  body.querySelectorAll('[data-rr]').forEach(b=>b.onclick=()=>{const[iid,r]=b.dataset.rr.split('|');m.retIid=null;addEvent('return',{iid,reason:r,newIid:uid('i')},id);toast('Plato devuelto: vuelve a cocina para rehacerse.')})}}

/* ---------- cocina (KDS por estación) ---------- */
function paneKitchen(root,st){let built=false;
 return function(){const id=getId(st);if(!id){built=false;return joinForm(root,st,'Cocinero · '+ST_NAME[st],()=>{built=false;mountLive()})}
  if(!built){built=true;root.innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:10px"><h2>${ST_NAME[st]} · ${esc(id.name)}</h2><div class="counters" id="kc-${st}"></div></div><div class="board" id="kb-${st}"></div>`}
  const its=Object.values(S.items).filter(i=>i.st===st&&!i.cancel);const board=root.querySelector('#kb-'+st);
  const q=its.filter(i=>!i.start).length,p=its.filter(i=>i.start&&!i.ready).length,r=its.filter(i=>i.ready&&!i.deliv).length;
  root.querySelector('#kc-'+st).innerHTML=`<span class="counter"><b>${q}</b>en cola</span><span class="counter"><b>${p}</b>en preparación</span><span class="counter"><b>${r}</b>en el pase</span>`;
  const sig=(S.session?1:0)+'|'+(S.closed?1:0)+'|'+its.filter(i=>!i.deliv).map(i=>i.iid+(i.start?'s':'')+(i.ready?'r':'')).join(',');if(board.dataset.sig===sig)return;board.dataset.sig=sig;
  if(!S.session){board.innerHTML='<div class="empty">Esperando que el facilitador inicie el simulacro.<br><br><button class="pri" data-selfstart>Iniciar una prueba ahora</button><br><span class="small muted">Úsalo si estás probando solo: arranca el simulacro en esta sala.</span></div>';return}
  const byO={};for(const i of its){if(i.deliv)continue;(byO[i.oid]=byO[i.oid]||[]).push(i)}
  const os=Object.keys(byO).map(k=>S.orders[k]).filter(Boolean).sort((a,b)=>a.t-b.t);
  if(!os.length){board.innerHTML='<div class="empty">Sin comandas pendientes en esta estación.</div>';return}
  board.innerHTML=os.map(o=>{const list=byO[o.oid].sort((a,b)=>a.t-b.t);const isNew=!UI.seenTickets.has(st+o.oid);UI.seenTickets.add(st+o.oid);
   return `<div class="ticket${isNew?' new':''}"><div class="th" data-tk="${o.oid}" data-st="${st}"><b>Mesa ${o.mesa}</b><span data-tt="${o.oid}">00:00</span></div><div class="tm">Pedido ${o.n} · ${esc(o.by.name)} · ingresó ${clk(o.t)}</div>`+
   list.map(i=>`<div class="it${i.ready?' done':''}"><span class="nm">${esc(DISH[i.dish].n)}</span>${S.closed?'':i.ready?'<span class="small muted">En el pase</span>':i.start?`<button class="pri" data-ry="${i.iid}">Listo</button>`:`<button data-sg="${i.iid}">Iniciar</button>`}
    ${i.mods.length||i.redoOf?`<div class="mods">${i.redoOf?'<span class="tag">REHACER · '+esc(S.items[i.redoOf]?S.items[i.redoOf].reason:'')+'</span>':''}${i.mods.map(x=>`<span class="mod">${esc(x)}</span>`).join('')}</div>`:''}</div>`).join('')+'</div>'}).join('');
  board.querySelectorAll('[data-sg]').forEach(b=>b.onclick=()=>addEvent('start',{iid:b.dataset.sg},getId(st)));
  board.querySelectorAll('[data-ry]').forEach(b=>b.onclick=()=>addEvent('ready',{iid:b.dataset.ry},getId(st)))}}

/* ---------- reloj y semáforo ---------- */
function tick(){if(!S)return;const s=S.session;const c=$('#clock');c.hidden=!s;if(s)$('#clockTxt').textContent=clk(now())+(S.closed?' · cerrado':'');
 document.querySelectorAll('[data-tk]').forEach(h=>{const o=S.orders[h.dataset.tk];if(!o)return;const st=h.dataset.st;const pend=o.items.map(i=>S.items[i]).filter(i=>i.st===st&&!i.cancel&&!i.ready);
  const lv=pend.length?pend.map(i=>light(i)).sort((a,b)=>['ok','warn','bad'].indexOf(b)-['ok','warn','bad'].indexOf(a))[0]:'pase';h.className='th '+(lv==='ok'?'':lv);
  const tt=h.querySelector('[data-tt]');if(tt)tt.textContent=mmss(simMin(o.t,now()))});
 document.querySelectorAll('[data-ot]').forEach(x=>{const o=S.orders[x.dataset.ot];if(!o||orderDone(o))return;const mn=simMin(o.t,now());x.textContent=mmss(mn);x.className=mn<=MESA_MAX?'t-ok':'t-bad'})}
setInterval(tick,1000);
let liveT=0;setInterval(()=>{if(S&&S.session&&!S.closed&&(ROUTE.vista==='panel'||ROUTE.vista==='demo')&&Date.now()-liveT>4000){liveT=Date.now();try{LIVE[0]()}catch(e){}}},2000);

/* ---------- QR ---------- */
function qrSvg(text){try{const q=qrcode(0,'M');q.addData(text);q.make();return q.createSvgTag({cellSize:4,margin:2,scalable:true,title:text})}catch(e){return '<div class="small">'+esc(text)+'</div>'}}

/* ---------- arranque ---------- */
if(ROUTE.sala)openRoom(ROUTE.sala);else{S=derive([]);setNet('local')}
mount();
window.PMKDS={get S(){return S},Sync,go,files};
document.addEventListener('click',e=>{if(!e.target.closest('[data-selfstart]'))return;if(!S||S.session)return;const id=getId('panel')||setId('panel','Prueba sin facilitador');const d=new Date();d.setHours(13,0,0,0);addEvent('session',{speed:10,simStart:d.getTime()},id);toast('Prueba iniciada. El reloj de hora punta arranca a las 13:00.')});
}
</script>
